<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importadora García</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans text-gray-900 min-h-screen flex flex-col justify-between">

    <!-- Navegación Superior -->
    <nav class="bg-black text-white p-4 flex justify-between items-center px-6 sticky top-0 z-40 shadow-lg">
        <h1 class="text-xl font-bold tracking-widest cursor-pointer" onclick="filterCategory('todos')">IMPORTADORA GARCÍA</h1>
        
        <!-- Botón de Menú Hamburguesa (3 rayas) -->
        <button onclick="toggleMenu()" class="text-2xl focus:outline-none p-1 hover:text-gray-300">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <!-- Menú Lateral Desplegable (Drawer / Sidebar) -->
    <div id="side-menu" class="fixed inset-y-0 right-0 w-72 bg-black text-white z-50 transform translate-x-full transition-transform duration-300 ease-in-out shadow-2xl p-6 flex flex-col justify-between">
        <div>
            <!-- Encabezado del menú con botón para cerrar -->
            <div class="flex justify-between items-center border-b border-gray-800 pb-4 mb-6">
                <h3 class="text-lg font-bold uppercase tracking-wider">Categorías</h3>
                <button onclick="toggleMenu()" class="text-2xl text-gray-400 hover:text-white">&times;</button>
            </div>

            <!-- Lista de Categorías -->
            <div class="flex flex-col space-y-3 font-medium">
                <button onclick="selectCategory('todos')" class="text-left px-3 py-2 rounded hover:bg-gray-800 transition flex items-center gap-3">
                    <i class="fas fa-th-large text-gray-400"></i> Todos los productos
                </button>
                <button onclick="selectCategory('termos')" class="text-left px-3 py-2 rounded hover:bg-gray-800 transition flex items-center gap-3">
                    <i class="fas fa-mug-hot text-gray-400"></i> Termos
                </button>
                <button onclick="selectCategory('pijamas')" class="text-left px-3 py-2 rounded hover:bg-gray-800 transition flex items-center gap-3">
                    <i class="fas fa-bed text-gray-400"></i> Pijamas
                </button>
                <button onclick="selectCategory('calcetines')" class="text-left px-3 py-2 rounded hover:bg-gray-800 transition flex items-center gap-3">
                    <i class="fas fa-socks text-gray-400"></i> Calcetines
                </button>
                <button onclick="selectCategory('ropa')" class="text-left px-3 py-2 rounded hover:bg-gray-800 transition flex items-center gap-3">
                    <i class="fas fa-tshirt text-gray-400"></i> Ropa
                </button>
                <button onclick="selectCategory('calzado')" class="text-left px-3 py-2 rounded hover:bg-gray-800 transition flex items-center gap-3">
                    <i class="fas fa-shoe-prints text-gray-400"></i> Calzado para el hogar
                </button>
                <button onclick="selectCategory('herramientas')" class="text-left px-3 py-2 rounded hover:bg-gray-800 transition flex items-center gap-3">
                    <i class="fas fa-tools text-gray-400"></i> Herramientas
                </button>
                <button onclick="selectCategory('peluches')" class="text-left px-3 py-2 rounded hover:bg-gray-800 transition flex items-center gap-3">
                    <i class="fas fa-paw text-gray-400"></i> Peluches
                </button>
            </div>
        </div>

        <!-- Pie del menú -->
        <div class="border-t border-gray-800 pt-4 text-xs text-gray-500 text-center">
            Importadora García &copy; 2026
        </div>
    </div>

    <!-- Fondo Oscuro para cuando el Menú esté Abierto -->
    <div id="menu-overlay" class="fixed inset-0 bg-black/50 z-40 hidden" onclick="toggleMenu()"></div>

    <!-- Encabezado / Banner -->
    <header class="bg-black text-white text-center py-10 px-4 border-t border-gray-800">
        <h2 id="category-title" class="text-3xl sm:text-4xl font-extrabold uppercase tracking-wide">Catálogo Oficial</h2>
        <p class="text-gray-400 mt-2 text-sm sm:text-base">Todo lo que quieras al alcance de un clic</p>
    </header>

    <!-- Catálogo de Productos -->
    <main class="max-w-6xl mx-auto py-10 px-4 flex-1 w-full">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- VISOR A PANTALLA COMPLETA (MODAL) -->
    <div id="image-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4" onclick="closeModal()">
        <div class="relative max-w-3xl max-h-[90vh] flex items-center justify-center">
            <button onclick="closeModal()" class="absolute -top-10 right-0 text-white text-3xl font-bold hover:text-gray-300">&times;</button>
            <img id="modal-img" src="" alt="Imagen ampliada" class="max-h-[85vh] max-w-full rounded-lg object-contain shadow-2xl">
        </div>
    </div>

    <!-- Script principal -->
    <script>
        const products = [
            {
                id: 1,
                name: "Termo Térmico de Acero Inoxidable",
                category: "termos",
                price: 7.50,
                images: [
                    "./Termos.png",
                    "./Termo1.png",
                    "./Termo2.png",
                    "./Termo3.png",
                    "./Termo4.png",
                    "./Termo5.png"
                ],
                description: "Mantiene tus bebidas frías o calientes durante todo el día. Excelente durabilidad y diseño moderno."
            },
            {
                id: 2,
                name: "Pijama Térmica de Algodón",
                category: "pijamas",
                price: 5,
                images: [
                    "./pijama1.jpeg",
                    "./pijama2.jpeg",
                    "./pijama3.jpeg",
                    "./pijama4.jpeg",
                    "./pijama5.jpeg"
                ],
                description: "Pijama ultra suave y cómoda, ideal para descansar y para noches frescas. Tela de alta calidad."
            },
            {
                id: 3,
                name: "Pack de Calcetines Afelpados",
                category: "calcetines",
                price: 1,
                images: [
                    "./Medias1.png"
                ],
                description: "Calcetines acojinados y térmicos, excelente ajuste y máxima comodidad para uso diario."
            }
            /* Aquí puedes ir agregando tus productos de Ropa, Calzado, Herramientas, Peluches, etc. */
        ];

        function renderProducts(items) {
            const container = document.getElementById('product-grid');
            container.innerHTML = '';
            
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-500">
                        <i class="fas fa-box-open text-5xl mb-3"></i>
                        <p class="text-lg font-medium">Próximamente agregaremos productos en esta categoría.</p>
                    </div>
                `;
                return;
            }

            items.forEach(product => {
                let thumbnailsHTML = '';
                product.images.forEach((img) => {
                    thumbnailsHTML += `
                        <img src="${img}" 
                             onclick="changeImage(${product.id}, '${img}')" 
                             class="w-12 h-12 object-contain rounded border border-gray-300 hover:border-black cursor-pointer mr-2 mt-2 bg-gray-50">
                    `;
                });

                const phone = "50369679021";
                const message = encodeURIComponent(`Hola, me interesa comprar el producto: ${product.name}`);
                const whatsappUrl = `https://wa.me/${phone}?text=${message}`;

                const card = `
                    <div class="bg-white rounded-lg shadow-md overflow-hidden flex flex-col justify-between">
                        <div class="w-full h-64 bg-gray-50 flex items-center justify-center p-2 cursor-zoom-in" onclick="openModal(document.getElementById('main-img-${product.id}').src)">
                            <img id="main-img-${product.id}" src="${product.images[0]}" alt="${product.name}" class="max-h-full max-w-full object-contain">
                        </div>
                        
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <span class="text-xs uppercase bg-gray-200 text-gray-700 px-2 py-1 rounded font-semibold">${product.category}</span>
                                <h3 class="text-lg font-bold mt-2">${product.name}</h3>
                                
                                <div class="flex flex-wrap my-2">
                                    ${thumbnailsHTML}
                                </div>

                                <p class="text-gray-600 text-sm mt-1">${product.description}</p>
                            </div>
                            <div class="mt-4 flex items-center justify-between">
                                <span class="text-xl font-extrabold">$${product.price}</span>
                                <a href="${whatsappUrl}" target="_blank" class="bg-black text-white px-4 py-2 rounded hover:bg-gray-800 transition flex items-center gap-2 text-sm font-medium">
                                    <i class="fa-brands fa-whatsapp text-lg"></i> Pedir por WhatsApp
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function changeImage(productId, newSrc) {
            document.getElementById(`main-img-${productId}`).src = newSrc;
        }

        function openModal(imgSrc) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            modalImg.src = imgSrc;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('image-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            const overlay = document.getElementById('menu-overlay');
            
            menu.classList.toggle('translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function selectCategory(cat) {
            toggleMenu(); // Cierra el menú lateral al seleccionar
            filterCategory(cat);
        }

        function filterCategory(cat) {
            const titleElement = document.getElementById('category-title');
            
            if (cat === 'todos') {
                titleElement.textContent = "Catálogo Oficial";
                renderProducts(products);
            } else {
                titleElement.textContent = cat.toUpperCase();
                const filtered = products.filter(p => p.category === cat);
                renderProducts(filtered);
            }
        }

        renderProducts(products);
    </script>
</body>
    </html>
