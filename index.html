<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importadora García</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans text-gray-900">

    <!-- Navegación -->
    <nav class="bg-black text-white p-4 flex flex-wrap justify-between items-center px-6 gap-2">
        <h1 class="text-xl font-bold tracking-widest">IMPORTADORA GARCÍA</h1>
        <div class="space-x-2 sm:space-x-4 text-sm sm:text-base">
            <button onclick="filterCategory('todos')" class="hover:text-gray-400">Todos</button>
            <button onclick="filterCategory('accesorios')" class="hover:text-gray-400">Termos</button>
            <button onclick="filterCategory('pijamas')" class="hover:text-gray-400">Pijamas</button>
            <button onclick="filterCategory('calcetines')" class="hover:text-gray-400">Calcetines</button>
        </div>
    </nav>

    <!-- Banner -->
    <header class="bg-black text-white text-center py-12 px-4 border-t border-gray-800">
        <h2 class="text-4xl font-extrabold uppercase">Catálogo Oficial</h2>
        <p class="text-gray-400 mt-2">Productos de alta calidad al mejor precio.</p>
    </header>

    <!-- Catálogo de Productos -->
    <main class="max-w-6xl mx-auto py-10 px-4">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- VISOR A PANTALLA COMPLETA (MODAL) -->
    <div id="image-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4" onclick="closeModal()">
        <div class="relative max-w-3xl max-h-[90vh] flex items-center justify-center">
            <button onclick="closeModal()" class="absolute -top-10 right-0 text-white text-3xl font-bold hover:text-gray-300">&times;</button>
            <img id="modal-img" src="" alt="Imagen ampliada" class="max-h-[85vh] max-w-full rounded-lg object-contain shadow-2xl">
        </div>
    </div>

    <!-- Script principal -->
    <script>
        const products = [
            {
                id: 1,
                name: "Termo Térmico de Acero Inoxidable",
                category: "uso Diario",
                price: 5,
                images: [
                    "./Termos.png",
                    "./Termo1.png",
                    "./Termo2.png",
                    "./Termo3.png",
                    "./Termo4.png",
                    "./Termo5.png"
                ],
                description: "Mantiene tus bebidas frías o calientes durante todo el día. Excelente durabilidad y diseño."
            },
            {
                id: 2,
                name: "Pijama Térmica de Algodón",
                category: "pijamas",
                price: 5,
                images: [
                    "./pijama1.png",
                    "./pijama2.png",
                    "./pijama3.png",
                    "./pijama4.png",
                    "./pijama5.png"
                ],
                description: "Pijama ultra suave y cómoda, ideal para noches frescas. Tela de alta calidad."
            },
            {
                id: 3,
                name: "Pack de Calcetines Afelpados",
                category: "calcetines",
                price: 1,
                images: [
                    "./Medias1.png"
                ],
                description: "Calcetines acojinados y térmicos, excelente ajuste y máxima comodidad."
            }
        ];

        function renderProducts(items) {
            const container = document.getElementById('product-grid');
            container.innerHTML = '';
            
            items.forEach(product => {
                let thumbnailsHTML = '';
                product.images.forEach((img) => {
                    thumbnailsHTML += `
                        <img src="${img}" 
                             onerror="handleImageError(this, '${img}')"
                             onclick="changeImage(${product.id}, this.src)" 
                             class="w-12 h-12 object-contain rounded border border-gray-300 hover:border-black cursor-pointer mr-2 mt-2 bg-gray-50">
                    `;
                });

                const phone = "50369679021";
                const message = encodeURIComponent(`Hola, me interesa comprar el producto: ${product.name}`);
                const whatsappUrl = `https://wa.me/${phone}?text=${message}`;

                const card = `
                    <div class="bg-white rounded-lg shadow-md overflow-hidden flex flex-col justify-between">
                        <div class="w-full h-64 bg-gray-50 flex items-center justify-center p-2 cursor-zoom-in" onclick="openModal(document.getElementById('main-img-${product.id}').src)">
                            <img id="main-img-${product.id}" src="${product.images[0]}" onerror="handleImageError(this, '${product.images[0]}')" alt="${product.name}" class="max-h-full max-w-full object-contain">
                        </div>
                        
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <span class="text-xs uppercase bg-gray-200 text-gray-700 px-2 py-1 rounded">${product.category}</span>
                                <h3 class="text-lg font-bold mt-2">${product.name}</h3>
                                
                                <div class="flex flex-wrap my-2">
                                    ${thumbnailsHTML}
                                </div>

                                <p class="text-gray-600 text-sm mt-1">${product.description}</p>
                            </div>
                            <div class="mt-4 flex items-center justify-between">
                                <span class="text-xl font-extrabold">$${product.price}</span>
                                <a href="${whatsappUrl}" target="_blank" class="bg-black text-white px-4 py-2 rounded hover:bg-gray-800 transition flex items-center gap-2">
                                    Pedir por WhatsApp
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // Si la imagen falla (por ejemplo con .png), el sistema intentará probar con .jpeg y .jpg automáticamente
        function handleImageError(imgElement, originalSrc) {
            if (!imgElement.dataset.triedJpeg) {
                imgElement.dataset.triedJpeg = "true";
                imgElement.src = originalSrc.replace(/\.png$/i, '.jpeg');
            } else if (!imgElement.dataset.triedJpg) {
                imgElement.dataset.triedJpg = "true";
                imgElement.src = originalSrc.replace(/\.jpeg$/i, '.jpg');
            } else if (!imgElement.dataset.noSpace) {
                imgElement.dataset.noSpace = "true";
                imgElement.src = originalSrc.replace(/\s+/g, '');
            }
        }

        function changeImage(productId, newSrc) {
            document.getElementById(`main-img-${productId}`).src = newSrc;
        }

        function openModal(imgSrc) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            modalImg.src = imgSrc;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('image-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function filterCategory(cat) {
            if (cat === 'todos') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.category === cat);
                renderProducts(filtered);
            }
        }

        renderProducts(products);
    </script>
</body>
    </html>
